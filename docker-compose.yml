services:
  pgrl:
    build: .
    container_name: pgrl-demo
    shm_size: "4gb"
    env_file:
      - .env
    volumes:
      # One persistent PostgreSQL instance is shared by every sequential
      # training run, GCM, and final validation in this single container.
      - pgrl_pg_data:/var/lib/postgresql/data
      - ./training_log:/app/training_log
      - ./merge_test_log:/app/merge_test_log
      - ./reference_configs:/app/reference_configs

volumes:
  pgrl_pg_data:
