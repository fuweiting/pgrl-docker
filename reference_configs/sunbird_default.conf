# --- Extracted from postgresql.conf (ADDED BY SUNBIRD) ---
'max_connections': '263',
'shared_buffers': '6017MB',
'work_mem': '16MB',
'temp_buffers': '64MB',
'maintenance_work_mem': '962MB',
'max_wal_size': '2GB',
'effective_cache_size': '12035MB',
'max_locks_per_transaction': '400',
'max_pred_locks_per_transaction': '200',
'max_stack_depth': '6MB',
'huge_pages': 'off',

# Autovacuum
'autovacuum_analyze_scale_factor': '0.05',
'autovacuum_analyze_threshold': '50',
'autovacuum_vacuum_cost_limit': '-1',
'autovacuum_vacuum_threshold': '50',
'autovacuum_vacuum_cost_delay': '2ms',

# Checkpoints
'checkpoint_completion_target': '0.9',
'checkpoint_timeout': '5min',

# Parallelization
'max_parallel_workers_per_gather': '2',
'max_parallel_workers': '12',
'max_worker_processes': '12',

# Concurrency & Planner
'effective_io_concurrency': '200',
'random_page_cost': '1',
'idle_in_transaction_session_timeout': '1h',
'enable_seqscan': 'on',
'enable_sort': 'on',

# WAL & HA
'wal_buffers': '180MB',
'max_wal_senders': '5',
'max_replication_slots': '5',
'wal_level': 'replica',
'tcp_keepalives_idle': '30',
'tcp_keepalives_interval': '15',
'tcp_keepalives_count': '4',

# Metrics
'track_io_timing': 'on',

# SSL
'ssl': 'no',
'ssl_min_protocol_version': 'TLSv1.3'